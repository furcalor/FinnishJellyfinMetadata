name: Build Jellyfin Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.FinnishMetadata.sln

      - name: Build Release
        run: dotnet build Jellyfin.Plugin.FinnishMetadata.sln --configuration Release --no-restore

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.FinnishMetadata
          path: Jellyfin.Plugin.FinnishMetadata/bin/Release/net8.0/Jellyfin.Plugin.FinnishMetadata.dll
